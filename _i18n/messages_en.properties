# English bundle. Same keys as messages.properties, same placeholders.
# Spanish stays the default (constitution 6); this one answers callers that
# explicitly ask for English.
# Encoding is UTF-8.

# Registering
ITEM_REQUIRED = The request needs at least one item before it can be registered.
ITEM_INCOMPLETE = Item {0} is incomplete: material, quantity or unit is missing.
ALREADY_REGISTERED = The request has already been registered.

# Items
ITEM_LAST_ON_REG = A registered request must keep at least one item.
ITEM_NO_READONLY = The item number is assigned by the system.
QUANTITY_POSITIVE = The quantity must be greater than zero.
MATERIAL_DUPLICATED = Material {0} is already on another item of this request.

# Releasing and immutability
NOT_REGISTERED = Only a registered request can be released; this one is {0}.
CARRIER_REQUIRED = The request cannot be released without a carrier.
RELEASED_IMMUTABLE = A released request cannot be modified.
DELETE_ONLY_DRAFT = Only draft requests can be deleted.

# Carriers
CARRIER_IN_USE = The carrier is assigned to {0} requests and cannot be deleted.
CARRIER_DUPLICATED = A carrier with code {0} already exists.
CARRIER_CODE_FIXED = The code of a carrier cannot be changed.

# CAP validation texts, overridden so both bundles stay in step
ASSERT_MANDATORY = A required value is missing.
ASSERT_TARGET = No record exists with that key.
